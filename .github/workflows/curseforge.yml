name: Publish ForeverHUD to CurseForge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (e.g. v0.9.5)
        required: true
        type: string
      dry_run:
        description: Validate the ZIP and CurseForge game version without uploading
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: curseforge-project-1801711
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    # The token lives in this environment, which only main may use, so a run
    # from an unreviewed branch never receives it.
    environment: curseforge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test publisher
        run: python3 -m unittest discover -s tests -p 'test_curseforge.py'
      - name: Upload release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          CURSE_FORGE: ${{ secrets.CURSE_FORGE }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/curseforge.py --tag "$RELEASE_TAG" --dry-run
          else
            python3 scripts/curseforge.py --tag "$RELEASE_TAG"
          fi
