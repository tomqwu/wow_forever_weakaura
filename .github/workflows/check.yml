name: Build and check
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Pinned so the native-schema gate is reproducible; bump deliberately.
  FOREVERAURAS_COMMIT: 6939ffc844c79022c8e3bd712999c95914450737
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 libcairo2
          python -m pip install -r requirements-dev.txt
      - name: Build import and companion
        run: python scripts/build.py
      - name: Committed imports match the generator
        run: git diff --exit-code -- dist/ForeverHUD-All-Classes.txt dist/classes src/ForeverHUD/Catalog.lua
      - name: Check logic, import and package
        run: python scripts/check.py
      - name: Check with ForeverAuras native validators
        run: |
          git init -q /tmp/foreverauras
          git -C /tmp/foreverauras fetch -q --depth 1 https://github.com/neroxrw/foreverauras.git "$FOREVERAURAS_COMMIT"
          git -C /tmp/foreverauras checkout -q FETCH_HEAD
          lua tests/native-schema.lua /tmp/foreverauras/ForeverAuras
          for import in dist/.build/classes/*.lua; do
            lua tests/native-schema.lua /tmp/foreverauras/ForeverAuras "$import"
          done
      - name: Verify generated preview document
        run: |
          python scripts/preview.py
          git diff --exit-code -- preview/index.html
      - name: Check preview behavior in Chromium
        run: |
          python -m playwright install --with-deps chromium
          python scripts/check_preview.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ForeverHUD-v0.13.3
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.txt
            dist/classes/*.txt
            dist/classes/manifest.json
            dist/classes/README.md
