name: Build and check
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 libcairo2
          python -m pip install -r requirements-dev.txt
      - name: Build import and companion
        run: python scripts/build.py
      - name: Check logic, import and package
        run: python scripts/check.py
      - name: Check with ForeverAuras native validators
        run: |
          git clone --depth 1 https://github.com/neroxrw/foreverauras.git /tmp/foreverauras
          lua tests/native-schema.lua /tmp/foreverauras/ForeverAuras
      - name: Verify generated preview document
        run: |
          python scripts/preview.py
          git diff --exit-code -- preview/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: Eclipse-Class-Combat-HUD-v0.2.0
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.txt
